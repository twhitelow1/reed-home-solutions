          06991 190-m7nTx3P2qHL6yzHHAKgH4A0FYwBdJ
          IDS
          ls -la /tmp/raw | head -40
      - name: Resize to web size
        run: |
          set -euo pipefail
          mkdir -p /tmp/sharp && cd /tmp/sharp && npm init -y >/dev/null && npm i sharp@0.33.5 --silent
          mkdir -p "$GITHUB_WORKSPACE/public/images/projects/edwards"
          cat > /tmp/sharp/r.cjs <<'JS'
          const sharp = require('sharp'), fs = require('fs'), out = process.argv[2];
          (async () => {
            for (const f of fs.readdirSync('/tmp/raw')) {
              const n = f.replace('.jpg', '');
              await sharp('/tmp/raw/' + f).rotate().resize({ width: 1600, withoutEnlargement: true }).webp({ quality: 72 }).toFile(`${out}/${n}.webp`);
              await sharp('/tmp/raw/' + f).rotate().resize({ width: 480 }).webp({ quality: 60 }).toFile(`${out}/${n}-thumb.webp`);
              console.log(n, fs.statSync(`${out}/${n}.webp`).size);
            }
          })();
          JS
          node /tmp/sharp/r.cjs "$GITHUB_WORKSPACE/public/images/projects/edwards"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/edwards
          git commit -m "Add web-size Edwards renovation photos (imported from Jace's shared Drive links)"
          git push
