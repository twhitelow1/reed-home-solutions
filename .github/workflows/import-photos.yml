# One-time import: downloads the Edwards renovation photos (shared Google Drive links from Jace's
# Sep 29 email), resizes them to web size and commits them. Delete this workflow after it runs.
name: Import Edwards project photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-photos.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download originals
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw
          while read n id; do
            curl -sSL --retry 3 -m 180 -o "/tmp/raw/$n.jpg" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
          done <<'IDS'
          06810 1PUVF-4I-Q70-kqs9H5wFsBKBmW8PuwkU
          06814 1vGor3_JShTPR7RIEgl1HYklJBkyeXP-X
